modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="AutoMods"
description='''全服共享行情的证券交易所：用等价交换（ProjectE）的 EMC 买股票，别人买入会推高市值，卖出会压低。'''
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="projecte"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
# 可选的手机联动（MCphone）：装了它，我们的 jar 里那份 SPI 名单会让手机多出一个「炒股」App，
# 同时把交易所手册导出到它的书城目录；没装就什么都不做，不影响任何原有功能。
[[dependencies.${mod_id}]]
modId="mcphone"
type="optional"
versionRange="*"
ordering="AFTER"
side="CLIENT"

# 一个小 Mixin（见 mixin/TransmutationInventoryMixin）：让等价交换的转化桌结算时保留负数 EMC。
# 没装等价交换时这个补丁不会生效，也不影响其他功能。
[[mixins]]
config = "shared_stock_exchange.mixins.json"
# 只有装了等价交换才需要这个补丁；没装的话连配置都不加载，绝对不添乱。
requiredMods = ["projecte"]
